name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test and publish (self-contained)
        shell: pwsh
        run: ./build.ps1 -SelfContained
      - uses: actions/upload-artifact@v4
        with:
          name: ChargeHub-win-x64
          path: artifacts/win-x64/
